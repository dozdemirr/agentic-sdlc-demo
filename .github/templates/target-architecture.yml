# Target Architecture Schema
# Generated by the 04-modernisation agent, consumed by 06-candidate-slices agent.
# Copy this template to /docs/target-architecture.yml and populate per your system.

metadata:
  system_name: ""                    # e.g., "PolicyHub"
  version: "1.0"
  created_by: ""                     # agent or person
  date: ""                           # YYYY-MM-DD

# Modernisation goals — what success looks like
goals:
  - metric: ""                       # e.g., "Release cadence"
    current: ""                      # e.g., "1 deploy/month"
    target: ""                       # e.g., "10+ deploys/month per service"
  # Add more goals as needed

# Target platform and infrastructure choices
platform:
  compute: ""                        # e.g., "Azure Container Apps"
  gateway: ""                        # e.g., "Azure API Management"
  database: ""                       # e.g., "Azure SQL"
  messaging: ""                      # e.g., "Azure Service Bus"
  observability: ""                  # e.g., "Application Insights + Log Analytics"
  ci_cd: ""                          # e.g., "GitHub Actions"

# Data access strategy — phased approach to data separation
data_strategy:
  phases:
    - name: "Shared Database"
      description: ""                # e.g., "All services share one database"
    - name: "Schema Separation"
      description: ""                # e.g., "Per-context schemas, cross-context reads via views"
    - name: "Database per Service"
      description: ""                # e.g., "Separate databases, events for cross-context communication"

# Target services — one entry per bounded context / service in the target architecture
services:
  - name: ""                         # e.g., "Pricing Service"
    bounded_context: ""              # e.g., "Pricing Engine"
    type: "api"                      # api | worker | frontend | gateway
    runtime: ""                      # e.g., ".NET 8"
    migration_pattern: ""            # strangler-fig | branch-by-abstraction | parallel-run | dual-write | rebuild | replatform | retain
    description: ""                  # 1–2 sentences
    current_source:
      modules: []                    # e.g., ["RatingEngine/", "PremiumCalculator.cs"]
      entry_points: []               # e.g., ["RatingEngine.svc"]
    target_endpoints: []             # e.g., ["POST /api/pricing/calculate"]
    data:
      owns_tables: []                # tables this service writes exclusively
      reads_tables: []               # tables this service reads but doesn't own
      shared_write_tables: []        # tables shared with other services (coupling risk)
    dependencies:
      internal: []                   # other target services it depends on
      external: []                   # third-party integrations
    risk: "low"                      # low | medium | high
    risk_rationale: ""               # why this risk level
    priority_hints:
      independence: "high"           # high | medium | low — can it run without other services migrated?
      learning_value: "high"         # high | medium | low — does it teach the team patterns?
      visibility: "medium"           # high | medium | low — can stakeholders see results?

  # Add more services following the same structure
  # - name: "Claims Service"
  #   ...

# Legacy system — what exists today and how it runs during migration
legacy:
  name: ""                           # e.g., "PolicyHub Monolith"
  runtime: ""                        # e.g., ".NET Framework 4.8 on IIS"
  hosting: ""                        # e.g., "On-prem Windows Server"
  migration_hosting: ""              # e.g., "Azure VM (rehosted)"
  decommission_strategy: ""          # e.g., "Module-by-module after 7-day soak per service"

# Routing — how traffic moves between legacy and new services
routing:
  strategy: ""                       # e.g., "API Management path-based routing"
  traffic_split_approach: ""         # e.g., "0% → 10% → 50% → 100% over 1 week per service"
  fallback: ""                       # e.g., "Revert API Management route to legacy endpoint"
